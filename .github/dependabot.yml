version: 2
updates:
  # Keep GitHub Actions up to date. The workflows currently use only
  # official `actions/*` steps, tag-pinned; pin any third-party action
  # by SHA when adding one and Dependabot will bump the SHA plus the
  # trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
    target-branch: contrib
    reviewers:
      - Lonsdale201
