name: Validate skill

on:
  pull_request:
    branches: [contrib, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-save js-yaml@4

      - name: Run validation
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: node .github/scripts/validate-skill.js
